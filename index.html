<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flora // ASCII Bloom</title>
<style>
  :root{--ink:#d8fff1;--muted:#89b8aa;--line:#245548;--panel:rgba(5,19,17,.78);--accent:#70ffc2}
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020807;color:var(--ink);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #screen{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab} #screen.dragging{cursor:grabbing}
  .vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.26) 72%,rgba(0,0,0,.78));mix-blend-mode:multiply}
  .hud{position:fixed;inset:0;pointer-events:none;padding:26px 30px;display:flex;justify-content:space-between;align-items:flex-start}
  .brand,.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 50px #0008,0 0 0 1px #8affda09 inset;backdrop-filter:blur(12px)}
  .brand{padding:15px 18px;min-width:236px;clip-path:polygon(0 0,100% 0,100% 83%,91% 100%,0 100%)}
  .brand b{display:block;color:var(--accent);font-size:15px;letter-spacing:.18em;text-shadow:0 0 18px #70ffc277}.brand span{display:block;margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:.08em}
  .panel{width:274px;padding:17px 18px}.panel h2{margin:0 0 15px;color:var(--accent);font-size:11px;letter-spacing:.2em;font-weight:400}.row{margin:14px 0}.rowhead{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.05em}.value{color:var(--ink)}
  input[type=range]{appearance:none;width:100%;height:2px;background:#31685a;outline:0;margin:9px 0 0}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border:1px solid #b4ffe1;border-radius:50%;background:#193c32;box-shadow:0 0 12px #70ffc2}input[type=range]::-moz-range-thumb{width:11px;height:11px;border:1px solid #b4ffe1;border-radius:50%;background:#193c32}
  .selectrow{display:flex;gap:7px;align-items:center;margin-top:18px}.selectrow label{color:var(--muted);font-size:10px}.selectrow select{flex:1;background:#0b241e;color:var(--ink);border:1px solid #326c5c;padding:6px;font:inherit;font-size:10px}
  .toggle{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #245548;margin-top:17px;padding-top:14px;color:var(--muted);font-size:10px}.toggle button{border:1px solid #4d9d80;background:#12372d;color:var(--accent);font:inherit;padding:5px 9px;cursor:pointer}.toggle button.on{background:#70ffc222;box-shadow:0 0 16px #70ffc233}
  .hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#89b8aa99;letter-spacing:.12em;font-size:9px;pointer-events:none;text-align:center}
  @media(max-width:700px){.hud{padding:13px;align-items:flex-end}.brand{position:absolute;top:13px;left:13px}.panel{width:calc(100vw - 26px);padding:11px 15px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.panel h2{grid-column:1/-1;margin-bottom:4px}.row{margin:9px 0}.selectrow,.toggle{grid-column:1/-1}.hint{bottom:8px}}
</style>
</head>
<body>
<canvas id="screen"></canvas><div class="vignette"></div>
<div class="hud">
  <div class="brand"><b>FLORA / 03</b><span>ASCII BOTANICAL OBSERVATORY</span></div>
  <section class="panel">
    <h2>LIVE PARAMETERS</h2>
    <div class="row"><div class="rowhead"><span>CELL RESOLUTION</span><span class="value" id="cellV">8px</span></div><input id="cell" type="range" min="5" max="18" value="8"></div>
    <div class="row"><div class="rowhead"><span>GLYPH DENSITY</span><span class="value" id="densityV">1.0</span></div><input id="density" type="range" min=".45" max="1.7" value="1" step=".05"></div>
    <div class="row"><div class="rowhead"><span>BLOOM OPENNESS</span><span class="value" id="bloomV">72%</span></div><input id="bloom" type="range" min="0" max="1" value=".72" step=".01"></div>
    <div class="row"><div class="rowhead"><span>WIND VELOCITY</span><span class="value" id="windV">0.60</span></div><input id="wind" type="range" min="0" max="1.5" value=".6" step=".01"></div>
    <div class="row"><div class="rowhead"><span>ORBIT VELOCITY</span><span class="value" id="spinV">0.35</span></div><input id="spin" type="range" min="0" max="1.5" value=".35" step=".01"></div>
    <div class="selectrow"><label>CHROMA</label><select id="palette"><option value="botanical">Botanical Bloom</option><option value="neon">Cyberpunk Neon</option><option value="matrix">Matrix Green</option><option value="amber">Amber CRT</option></select></div>
    <div class="toggle"><span>COLOR ENCODING</span><button id="colorBtn" class="on">● ACTIVE</button></div>
  </section>
</div>
<div class="hint">DRAG TO ORBIT &nbsp;·&nbsp; SCROLL TO ZOOM &nbsp;·&nbsp; THE GARDEN IS ALIVE</div>
<script>
(() => {
  const out=document.querySelector('#screen'), ctx=out.getContext('2d',{alpha:false});
  const buf=document.createElement('canvas'), bctx=buf.getContext('2d',{alpha:false});
  const depth=document.createElement('canvas'), dctx=depth.getContext('2d',{alpha:true});
  const normal=document.createElement('canvas'), nctx=normal.getContext('2d',{alpha:true});
  const $=id=>document.getElementById(id);
  const state={cell:8,density:1,bloom:.72,wind:.6,spin:.35,palette:'botanical',color:true,yaw:0.22,pitch:-.08,zoom:1,t:0};
  const palettes={
    botanical:{bg:[2,10,8], low:[12,56,39], high:[214,255,177], petal:[255,94,173], leaf:[64,208,126], gold:[255,205,75]},
    neon:{bg:[3,3,18], low:[23,10,79], high:[240,248,255], petal:[255,38,151], leaf:[28,255,211], gold:[255,221,42]},
    matrix:{bg:[0,5,1], low:[2,35,13], high:[168,255,155], petal:[32,207,75], leaf:[26,200,75], gold:[144,255,50]},
    amber:{bg:[12,7,2], low:[57,28,8], high:[255,232,143], petal:[237,104,28], leaf:[192,135,31], gold:[255,211,74]}
  };
  const glyphs=' .:-=+*#%@';
  function resize(){out.width=innerWidth;out.height=innerHeight;const s=Math.min(1,1000/innerWidth);buf.width=Math.max(360,innerWidth*s);buf.height=Math.max(240,innerHeight*s);depth.width=normal.width=buf.width;depth.height=normal.height=buf.height}
  addEventListener('resize',resize); resize();
  ['cell','density','bloom','wind','spin'].forEach(id=>$(id).oninput=e=>{state[id]=+e.target.value; updateLabels()});
  $('palette').onchange=e=>state.palette=e.target.value;
  $('colorBtn').onclick=()=>{state.color=!state.color;$('colorBtn').textContent=state.color?'● ACTIVE':'○ MONO';$('colorBtn').classList.toggle('on',state.color)};
  function updateLabels(){$('cellV').textContent=state.cell+'px';$('densityV').textContent=state.density.toFixed(2);$('bloomV').textContent=Math.round(state.bloom*100)+'%';$('windV').textContent=state.wind.toFixed(2);$('spinV').textContent=state.spin.toFixed(2)}
  let dragging=false,px=0,py=0;
  out.onpointerdown=e=>{dragging=true;px=e.clientX;py=e.clientY;out.classList.add('dragging');out.setPointerCapture(e.pointerId)};
  out.onpointermove=e=>{if(!dragging)return;state.yaw+=(e.clientX-px)*.008;state.pitch=Math.max(-.8,Math.min(.6,state.pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY};
  out.onpointerup=()=>{dragging=false;out.classList.remove('dragging')};
  out.onwheel=e=>{state.zoom=Math.max(.65,Math.min(1.7,state.zoom-e.deltaY*.0007));e.preventDefault()};
  const V=(x,y,z)=>({x,y,z}), add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), mul=(a,n)=>V(a.x*n,a.y*n,a.z*n);
  function rotate(p){let cy=Math.cos(state.yaw),sy=Math.sin(state.yaw),cp=Math.cos(state.pitch),sp=Math.sin(state.pitch);let x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy;return V(x, p.y*cp-z*sp, p.y*sp+z*cp)}
  function project(p){let q=rotate(p), scale=Math.min(buf.width,buf.height)*.34*state.zoom, cam=5.8, f=cam/(cam-q.z);return {x:buf.width/2+q.x*scale*f,y:buf.height*.57-q.y*scale*f,z:q.z, s:f}}
  function rgb(c,a=1){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}
  function lerp(a,b,t){return a+(b-a)*t}
  const primitives=[];
  function drawPrimitive(target,points,col,alpha,depthValue){
    target.beginPath();target.moveTo(points[0].x,points[0].y);
    target.quadraticCurveTo(points[1].x,points[1].y,points[2].x,points[2].y);
    target.quadraticCurveTo(points[3].x,points[3].y,points[0].x,points[0].y);target.closePath();
    target.fillStyle=rgb(col,alpha);target.fill();
    if(target===dctx){target.fillStyle=`rgba(${depthValue},255,255,.92)`;target.fill()}
    if(target===nctx){target.fillStyle='rgba(180,220,255,.72)';target.fill()}
  }
  function petal(points,col,glow=0){
    const p=points.map(project), averageZ=p.reduce((sum,v)=>sum+v.z,0)/p.length;
    primitives.push({p,col,glow,averageZ});
  }
  function flushPrimitives(){
    primitives.sort((a,b)=>a.averageZ-b.averageZ);
    for(const primitive of primitives){
      bctx.shadowColor=rgb(primitive.col,.55);bctx.shadowBlur=primitive.glow;
      drawPrimitive(bctx,primitive.p,primitive.col,1,128+primitive.averageZ*35);
      bctx.shadowBlur=0;drawPrimitive(dctx,primitive.p,primitive.col,1,128+primitive.averageZ*35);
      drawPrimitive(nctx,primitive.p,[180,220,255],.72,128+primitive.averageZ*35);
    }
    primitives.length=0;
  }
  function drawScene(t){
    const pal=palettes[state.palette], W=buf.width,H=buf.height;
    bctx.fillStyle=rgb(pal.bg);bctx.fillRect(0,0,W,H);dctx.clearRect(0,0,W,H);nctx.clearRect(0,0,W,H);
    // atmospheric halo and ground grid
    let g=bctx.createRadialGradient(W/2,H*.48,5,W/2,H*.48,H*.55);g.addColorStop(0,rgb(pal.low,.35));g.addColorStop(1,rgb(pal.bg,0));bctx.fillStyle=g;bctx.fillRect(0,0,W,H);
    bctx.strokeStyle=rgb(pal.leaf,.12);dctx.strokeStyle='rgba(90,180,120,.32)';nctx.strokeStyle='rgba(180,220,255,.22)';bctx.lineWidth=dctx.lineWidth=nctx.lineWidth=1;
    for(let i=-5;i<=5;i++){let a=project(V(i*.42,-1.47,-1.8)),z=project(V(i*.42,-1.47,1.8));for(const target of [bctx,dctx,nctx]){target.beginPath();target.moveTo(a.x,a.y);target.lineTo(z.x,z.y);target.stroke()}}
    for(let i=0;i<8;i++){let a=project(V(-2.2,-1.47,-1.8+i*.5)),z=project(V(2.2,-1.47,-1.8+i*.5));for(const target of [bctx,dctx,nctx]){target.beginPath();target.moveTo(a.x,a.y);target.lineTo(z.x,z.y);target.stroke()}}
    const sway=Math.sin(t*.001*state.wind*1.7)*.11+Math.sin(t*.001*state.wind*.73)*.055;
    const root=V(0,-1.45,0), top=V(sway,.55,0);
    // stem as a softly shaded tapered ribbon
    const a=project(root),b=project(top);for(const target of [bctx,dctx,nctx]){target.lineCap='round';target.lineWidth=12;target.strokeStyle=target===bctx?rgb(pal.leaf,.75):'rgba(100,210,130,.75)';target.beginPath();target.moveTo(a.x,a.y);target.quadraticCurveTo((a.x+b.x)/2+8,(a.y+b.y)/2,b.x,b.y);target.stroke();target.lineWidth=4;target.strokeStyle=target===bctx?rgb(pal.high,.45):'rgba(180,220,255,.5)';target.stroke()}
    // leaves
    for(let side of [-1,1]){let base=V(sway*.5,-.35,0), tip=V(sway+side*.8,.02,side*.1);let mid=add(base,mul(add(tip,mul(base,-1)),.5));petal([base,add(mid,V(0,.15,side*.15)),tip,add(mid,V(0,-.08,-side*.1))],pal.leaf,8)}
    for(let side of [-1,1]){let base=V(sway*.7,-.85,0),tip=V(sway+side*.55,-.56,-.1);petal([base,add(base,V(side*.25,.23,0)),tip,add(base,V(side*.2,-.03,.15))],pal.leaf,5)}
    // flower head: layered radial petals, each is a bent 3D lozenge.
    const center=V(sway,.62,0), n=state.bloom, layers=[{count:12,r:.62,len:1.04,w:.42,z:.02},{count:10,r:.4,len:.9,w:.34,z:.2},{count:8,r:.18,len:.66,w:.27,z:.35}];
    for(let li=0;li<layers.length;li++){let L=layers[li];for(let i=0;i<L.count;i++){let ang=i/L.count*Math.PI*2+li*.2;let tilt=(1-n)*.72;let radial=V(Math.cos(ang),0,Math.sin(ang));let base=add(center,mul(radial,L.r));let end=add(base,mul(V(radial.x*Math.cos(tilt),Math.sin(tilt)+.05,radial.z*Math.cos(tilt)),L.len));let side=V(-radial.z*L.w,0,radial.x*L.w);let col=[lerp(pal.petal[0],pal.high[0],li/4),lerp(pal.petal[1],pal.high[1],li/4),lerp(pal.petal[2],pal.high[2],li/4)];petal([add(base,side),add(end,mul(side,.15)),add(end,mul(side,-.15)),add(base,mul(side,-1))],col,li===2?14:7)}}
    flushPrimitives();
    // center disk and stamens
    let cp=project(center), diskRadius=Math.max(8,27*cp.s);
    for(const target of [bctx,dctx,nctx]){target.fillStyle=target===bctx?rgb(pal.gold,.95):'rgba(230,190,70,.95)';target.shadowColor=target===bctx?rgb(pal.gold,.8):'transparent';target.shadowBlur=target===bctx?14:0;target.beginPath();target.arc(cp.x,cp.y,diskRadius,0,7);target.fill();target.shadowBlur=0}
    for(let i=0;i<30;i++){let an=i*2.399, rr=(.14+(i%5)*.045)*n;let st=add(center,V(Math.cos(an)*rr,.12+(i%3)*.035,Math.sin(an)*rr));let ep=add(st,V(Math.cos(an)*.12,.16,Math.sin(an)*.12));let u=project(st),v=project(ep);for(const target of [bctx,dctx,nctx]){target.strokeStyle=target===bctx?rgb(pal.high,.85):'rgba(200,240,180,.8)';target.lineWidth=1;target.beginPath();target.moveTo(u.x,u.y);target.lineTo(v.x,v.y);target.stroke();target.fillStyle=target===bctx?rgb(pal.gold):'rgba(255,205,75,.9)';target.fillRect(v.x-1,v.y-1,3,3)}}
    // Floating pollen provides depth cues around the bloom.
    for(let i=0;i<24;i++){let an=i*2.618, radius=.7+(i%6)*.16, y=.55+Math.sin(t*.001*state.wind+i)*.32+(i%4)*.12;let p=project(add(center,V(Math.cos(an+t*.00015)*radius,y-.62,Math.sin(an+t*.00015)*radius)));let r=1+(i%3);for(const target of [bctx,dctx,nctx]){target.fillStyle=target===bctx?rgb(pal.gold,.7):'rgba(255,220,100,.72)';target.beginPath();target.arc(p.x,p.y,r,0,7);target.fill()}}
  }
  function ascii(){
    const W=out.width,H=out.height,cell=state.cell, sx=buf.width/out.width, sy=buf.height/out.height;
    ctx.fillStyle=rgb(palettes[state.palette].bg);ctx.fillRect(0,0,W,H);
    ctx.font=`${Math.max(8,cell*1.18)}px ui-monospace,monospace`;ctx.textBaseline='top';
    const colorPixels=bctx.getImageData(0,0,buf.width,buf.height).data;
    const depthPixels=dctx.getImageData(0,0,depth.width,depth.height).data;
    const normalPixels=nctx.getImageData(0,0,normal.width,normal.height).data;
    const step=cell, pal=palettes[state.palette];
    for(let y=0;y<H;y+=step){for(let x=0;x<W;x+=step){
      let bx=Math.min(buf.width-1,Math.floor(x*sx+cell*sx*.5)),by=Math.min(buf.height-1,Math.floor(y*sy+cell*sy*.5));
      let offset=(by*buf.width+bx)*4,pix=colorPixels.subarray(offset,offset+4),lum=(pix[0]*.2126+pix[1]*.7152+pix[2]*.0722)/255;
      let d=depthPixels[offset+3]/255,nPix=normalPixels.subarray(offset,offset+4);
      if(lum<.025||d<.05)continue;
      let leftOffset=(by*buf.width+Math.max(0,bx-2))*4,rightOffset=(by*buf.width+Math.min(buf.width-1,bx+2))*4;
      let left=colorPixels.subarray(leftOffset,leftOffset+4),right=colorPixels.subarray(rightOffset,rightOffset+4);
      let normalBoost=(nPix[3]/255)*(0.72+nPix[1]/255*.48)+Math.abs(right[1]-left[1])*.004;
      let v=Math.max(0,Math.min(1,(lum*.72+normalBoost*.08+d*.25)*state.density));let ch=glyphs[Math.min(glyphs.length-1,Math.floor(v*glyphs.length))];
      let color=state.color?[pix[0],pix[1],pix[2]]:[Math.round(lerp(pal.low[0],pal.high[0],v)),Math.round(lerp(pal.low[1],pal.high[1],v)),Math.round(lerp(pal.low[2],pal.high[2],v))];
      ctx.fillStyle=rgb(color,Math.min(1,.52+v*.65));ctx.fillText(ch,x,y);
    }}
    // scanline and phosphor glints
    ctx.fillStyle=rgb(pal.high,.035);for(let y=0;y<H;y+=cell*2)ctx.fillRect(0,y,W,1);
  }
  let lastFrame=performance.now();
  function frame(t){let delta=Math.min(50,t-lastFrame);lastFrame=t;if(!dragging)state.yaw+=state.spin*delta*.00042;state.t=t;drawScene(t);ascii();requestAnimationFrame(frame)} requestAnimationFrame(frame);
})();
</script>
</body>
</html>
